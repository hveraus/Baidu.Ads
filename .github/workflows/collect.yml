name: Verify SSW paid report
on:
  push:
    branches: [ssw-paid-only]
    paths: [.github/workflows/collect.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read SSW paid promotion report
        env:
          BAIDU_TONGJI_CREDENTIALS_JSON: ${{ secrets.BAIDU_TONGJI_CREDENTIALS_JSON }}
          BAIDU_TONGJI_SSW_SITE_JSON: ${{ vars.BAIDU_TONGJI_SSW_SITE_JSON }}
        run: |
          python3 - <<'PY'
          import datetime as dt
          import json
          import os
          from scripts.sync_website_conversions import BEIJING, fetch_paid_day, tongji

          try:
              config = json.loads(os.environ['BAIDU_TONGJI_CREDENTIALS_JSON'])
              config.update(json.loads(os.environ['BAIDU_TONGJI_SSW_SITE_JSON']))
              assert any(site.get('site_id') == config['site_id'] and site.get('status') == 0
                         for site in tongji(config, 'getSiteList')['list'])
              print('SSW site access confirmed.')
              day = dt.datetime.now(BEIJING).date()
              stamp = day.strftime('%Y%m%d')
              for metric, extra in [('visit_count', {}), ('trans_count', {'target': config['contact_click_target']})]:
                  result = tongji(config, 'getData', {
                      'site_id': config['site_id'], 'method': 'pro/hour/a', 'adProduct': '0,0',
                      'start_date': stamp, 'end_date': stamp, 'metrics': metric, **extra
                  })['result']
                  fields = result.get('fields', [])
                  totals = result.get('sum')
                  print(f'{metric}: expected fields={fields[1:] == [metric]}, '
                        f'summary present={totals is not None}, empty report={result.get("total") == 0}.')
              row = fetch_paid_day(config, day, config['contact_click_target'])
              print(f'Paid report parsed successfully. Paid visits observed: {bool(row and row["paid_sessions"])}.')
          except (AssertionError, ValueError, KeyError, TypeError, IndexError):
              raise SystemExit('Could not validate the paid SSW report. Check access or response format.') from None
          PY

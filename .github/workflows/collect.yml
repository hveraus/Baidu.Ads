name: Collect Baidu Ads data
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: baidu-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: 'pip install --only-binary=:all: -r requirements.txt'
      - name: Restore encrypted history
        env:
          DATA_BACKUP_KEY: ${{ secrets.DATA_BACKUP_KEY }}
        run: python scripts/vault.py restore
      - name: Sync TinaCMS website conversions
        env:
          BAIDU_TONGJI_CREDENTIALS_JSON: ${{ secrets.BAIDU_TONGJI_CREDENTIALS_JSON }}
        run: |
          if ! python scripts/sync_website_conversions.py; then
            echo '::warning::TinaCMS website analytics could not sync. The previous website totals were retained.'
          fi
      - name: Collect, verify and prepare publication
        env:
          BAIDU_CREDENTIALS_JSON: ${{ secrets.BAIDU_CREDENTIALS_JSON }}
          DATA_BACKUP_KEY: ${{ secrets.DATA_BACKUP_KEY }}
          BAIDU_YAKSHAVER_CREDENTIALS_JSON: ${{ secrets.BAIDU_YAKSHAVER_CREDENTIALS_JSON }}
          BAIDU_SSW_CREDENTIALS_JSON: ${{ secrets.BAIDU_SSW_CREDENTIALS_JSON }}
        run: |
          python tracker.py
          python scripts/verify_data.py
          python scripts/publish_data.py
          python dashboard.py --public
          python scripts/accounts.py collect --account yakshaver
          python scripts/accounts.py collect --account ssw
          python scripts/vault.py backup
          python scripts/vault.py verify
          python scripts/check_public.py
      - name: Save updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data accounts backups/private-data.enc report
          if ! git diff --cached --quiet; then
            git commit -m "Update Baidu Ads data and reports"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Summarise collection without credentials
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          accounts = {'TinaCMS':'data/status.json', 'YakShaver':'accounts/yakshaver/data/status.json', 'SSW':'accounts/ssw/data/status.json'}
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('## Baidu Ads collection\n\n')
              for name, path in accounts.items():
                  s=json.loads(Path(path).read_text())
                  f.write(f"- **{name}**: {len(s['reports'])} reports, through {s['end']}; token expiry {s['token_expires']}\n")
                  if s.get('warning'): f.write('  - **Authorisation renewal required soon.**\n')
          PY
  publish:
    needs: collect
    uses: ./.github/workflows/pages.yml
    permissions:
      contents: read
      pages: write
      id-token: write

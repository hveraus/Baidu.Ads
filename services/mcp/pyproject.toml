[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[project]
name = "baidu-ads-mcp"
version = "0.1.0"
description = "Isolated Baidu Ads MCP queries, approvals and bounded execution workflows"
requires-python = ">=3.11"
dependencies = ["mcp==1.26.0", "cryptography==48.0.1", "starlette==0.52.1"]

[project.scripts]
baidu-ads-mcp = "baidu_ads_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baidu_ads_mcp"]
